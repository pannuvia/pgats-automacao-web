name: Cypress CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes Cypress
        run: npx cypress run --spec cypress/e2e/automation-exercise.cy.js --headless

      - name: Upload de relatórios Cypress
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-junit-report
          path: cypress/reports
          if-no-files-found: warn
          retention-days: 7
